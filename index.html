<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | FirstName LastName</title>
    <!-- Google Fonts: Montserrat for Title & About, Roboto Mono for Subtitle -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Mono:wght@600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --banner-img: url('https://upload.wikimedia.org/wikipedia/commons/f/f3/Predawn_sky_with_deep_blue_hues_%28d062ce63-14b5-4cc2-a64e-62a33af3aeff%29.jpg');
            --accent-white: rgba(255, 255, 255, 0.9);
            --sub-text: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: white;
        }

        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center; /* Vertically center main content */
            justify-content: center; /* Horizontally center main content */
            text-align: center; 
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), var(--banner-img); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        .content {
            position: relative;
            z-index: 10;
            pointer-events: none; 
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(
                circle 250px at var(--x, 50%) var(--y, 50%), 
                rgba(255, 255, 255, 0.1) 0%, 
                rgba(255, 255, 255, 0.03) 40%,
                transparent 100%
            );
            z-index: 2;
            transition: background 0.05s ease-out;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin: 0;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-transform: uppercase; 
            word-spacing: 0.4em; 
            color: var(--accent-white);
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
            width: 50%;
            margin: 1.5rem auto;
        }

        h2 {
            font-family: 'Roboto Mono', monospace;
            font-weight: 600;
            font-size: clamp(0.9rem, 2.2vw, 1.4rem);
            color: var(--sub-text);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Vertical accent line - Separates title area from about area */
        .vertical-divider {
            height: 50px;
            width: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0));
            margin: 2.5rem 0 1.5rem 0;
        }
        
        #about-text {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.95rem, 1.4vw, 1.1rem);
            color: rgba(255, 255, 255, 0.7);
            max-width: 650px;
            margin: 0 auto; 
            line-height: 1.6;
            letter-spacing: 0.04em;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        @media (max-width: 768px) {
            h2 { letter-spacing: 0.1em; font-size: 0.85rem; }
            h1 { word-spacing: 0.2em; }
            hr { width: 80%; }
            .vertical-divider { margin: 1.5rem 0; height: 35px; }
        }
    </style>
</head>
<body>

    <section class="hero" id="hero">
        <canvas id="canvas"></canvas>
        <div class="spotlight" id="spotlight"></div>
        <div class="content">
            <!-- Main Heading Group (Centered) -->
            <div class="header-group">
                <h1>FirstName LastName</h1> 
                <hr>
                <h2>Operations Specialist & Systems Architect</h2>
            </div>
            
            <!-- Visual transition to secondary info -->
            <div class="vertical-divider"></div>

            <!-- About Text (Horizontally Centered) -->
            <p id="about-text">I help small businesses work smarter, save time, and scale by building the systems that run behind the scenes.</p>
        </div>
    </section>

    <script>
        const hero = document.getElementById('hero');
        const spotlight = document.getElementById('spotlight');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        hero.addEventListener('mousemove', e => {
            const rect = hero.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            spotlight.style.setProperty('--x', `${x}px`);
            spotlight.style.setProperty('--y', `${y}px`);
            spawnSymbols(x, y);
        });

        // Touch support for mobile interaction
        hero.addEventListener('touchmove', e => {
            const rect = hero.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            spotlight.style.setProperty('--x', `${x}px`);
            spotlight.style.setProperty('--y', `${y}px`);
            spawnSymbols(x, y);
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        const shapes = ['process', 'decision', 'terminator', 'document'];

        class SymbolParticle {
            constructor(x, y) {
                this.x = x; 
                this.y = y;
                this.shape = shapes[Math.floor(Math.random() * shapes.length)];
                this.size = Math.random() * 10 + 8;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.life = 1.0; 
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.life * 0.3})`;
                ctx.lineWidth = 1.2;
                ctx.beginPath();

                if (this.shape === 'process') {
                    ctx.strokeRect(-this.size, -this.size/1.5, this.size * 2, this.size * 1.3);
                } else if (this.shape === 'decision') {
                    ctx.moveTo(0, -this.size); 
                    ctx.lineTo(this.size * 1.2, 0); 
                    ctx.lineTo(0, this.size); 
                    ctx.lineTo(-this.size * 1.2, 0); 
                    ctx.closePath(); 
                    ctx.stroke();
                } else if (this.shape === 'terminator') {
                    const w = this.size * 1.6; const h = this.size * 0.9;
                    if (ctx.roundRect) {
                        ctx.roundRect(-w/2, -h/2, w, h, 15); 
                    } else {
                        ctx.rect(-w/2, -h/2, w, h);
                    }
                    ctx.stroke();
                } else if (this.shape === 'document') {
                    const w = this.size * 0.8; const h = this.size * 1.1;
                    ctx.moveTo(-w, -h); 
                    ctx.lineTo(w, -h); 
                    ctx.lineTo(w, h * 0.8);
                    ctx.quadraticCurveTo(0, h * 1.2, -w, h * 0.8); 
                    ctx.closePath(); 
                    ctx.stroke();
                }
                ctx.restore();
            }

            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                this.rotation += this.rotationSpeed; 
                this.life -= 0.006; 
            }
        }

        function spawnSymbols(x, y) {
            if (Math.random() > 0.85 && particles.length < 60) {
                particles.push(new SymbolParticle(x, y));
            }
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        const opacity = (1 - distance / 150) * Math.min(particles[i].life, particles[j].life) * 0.2;
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        ctx.lineWidth = 0.5; 
                        ctx.setLineDash([5, 5]); 
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y); 
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke(); 
                        ctx.setLineDash([]);
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawLines();
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) { 
                    particles.splice(i, 1); 
                    i--; 
                }
            }
            requestAnimationFrame(animate);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) { 
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { 
                if (w < 2 * r) r = w / 2; 
                if (h < 2 * r) r = h / 2; 
                this.moveTo(x + r, y); 
                this.arcTo(x + w, y, x + w, y + h, r); 
                this.arcTo(x + w, y + h, x, y + h, r); 
                this.arcTo(x, y + h, x, y, r); 
                this.arcTo(x, y, x + w, y, r); 
                this.closePath(); 
                return this; 
            } 
        } 
        
        animate();
    </script> 
</body> 
</html>
